name: Build, verify and deploy docs

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-\${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare local math and diagram assets
        run: |
          npm install --prefix "$RUNNER_TEMP/site-deps" --no-audit --no-fund --ignore-scripts katex@0.16.22 mermaid@11.6.0 playwright@1.51.1
          mkdir -p assets/vendor/katex assets/vendor/mermaid
          cp "$RUNNER_TEMP/site-deps/node_modules/katex/dist/katex.min.js" "$RUNNER_TEMP/site-deps/node_modules/katex/dist/katex.min.css" assets/vendor/katex/
          cp -r "$RUNNER_TEMP/site-deps/node_modules/katex/dist/fonts" assets/vendor/katex/
          cp -r "$RUNNER_TEMP/site-deps/node_modules/mermaid/dist/." assets/vendor/mermaid/
      - name: Build Jekyll
        env:
          JEKYLL_ENV: production
        run: bundle exec jekyll build --baseurl /ai-storage-notes
      - name: Check rendered links
        run: python scripts/check_site_links.py _site /ai-storage-notes
      - name: Browser verification
        env:
          BASEURL: /ai-storage-notes
          EXPECTED_LOGO: logo-theme.svg
          EXPECTED_FAVICON: favicon-storage.svg
          EXPECTED_GROUPS: "5"
          EXPECTED_TOPICS: "8"
        run: |
          "$RUNNER_TEMP/site-deps/node_modules/.bin/playwright" install --with-deps chromium
          NODE_PATH="$RUNNER_TEMP/site-deps/node_modules" node scripts/check_brand_ui.cjs
      - name: Validate Edit this page links
        run: |
          ruby <<'RUBY'
          require "yaml"

          config = YAML.load_file("_config.yml")
          edit = config.dig("docsteer", "edit_page") || {}
          expected_repo = "https://github.com/#{ENV.fetch("GITHUB_REPOSITORY")}"
          abort "edit_page.repo must be #{expected_repo}" unless edit["repo"] == expected_repo

          prefix = "#{edit["repo"]}/edit/#{edit["branch"]}/"
          links = Dir["_site/**/*.html"].flat_map do |html|
            File.read(html).scan(/<a class="doc-head__edit" href="([^"]+)"/).flatten.map { |href| [html, href] }
          end
          abort "No Edit this page links found in built site" if links.empty?

          errors = []
          links.each do |html, href|
            unless href.start_with?(prefix)
              errors << "#{html}: unexpected edit URL #{href}"
              next
            end
            source = href.delete_prefix(prefix)
            errors << "#{html}: source file not found: #{source}" unless File.file?(source)
          end
          abort errors.join("\n") unless errors.empty?
          puts "Validated #{links.length} Edit this page links."
          RUBY
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: \${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
