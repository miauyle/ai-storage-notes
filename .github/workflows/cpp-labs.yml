name: Learning content checks

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpu-and-http-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake g++ libcurl4-openssl-dev
      - name: Configure
        run: cmake -S examples/cpp-data-path -B build/cpp-labs -DCMAKE_BUILD_TYPE=Debug
      - name: Build
        run: cmake --build build/cpp-labs --parallel 2
      - name: CPU and local HTTP tests (not S3 or GPU integration)
        run: ctest --test-dir build/cpp-labs --output-on-failure

  site-links:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - name: Prepare browser icon renderer
        run: python3 -m pip install cairosvg==2.8.2
      - name: Build documentation without deploying
        run: bundle exec jekyll build --baseurl /ai-storage-notes
        env:
          JEKYLL_ENV: production
      - name: Check rendered documentation links and anchors
        run: python3 scripts/check_site_links.py _site /ai-storage-notes
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Browser brand verification
        env:
          BASEURL: /ai-storage-notes
          EXPECTED_LOGO: logo-theme.svg
          EXPECTED_FAVICON: favicon-storage.svg
          EXPECTED_GROUPS: "5"
          EXPECTED_TOPICS: "8"
        run: |
          npm install --prefix "$RUNNER_TEMP/brand-ui" --no-audit --no-fund --ignore-scripts playwright@1.51.1
          "$RUNNER_TEMP/brand-ui/node_modules/.bin/playwright" install --with-deps chromium
          NODE_PATH="$RUNNER_TEMP/brand-ui/node_modules" node scripts/check_brand_ui.cjs
